<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concerts in Milwaukee, WI | Brew City Shows</title>
  <meta name="description" content="Discover upcoming concerts, live music, and club shows in Milwaukee, WI. Filter tonight's gigs by neighborhood, venue, and price." />
  <style>
    :root {
      --bg-page: #f7f8fa;
      --bg-white: #ffffff;
      --bg-subtle: #f1f3f5;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --teal: #00cec8;
      --teal-dark: #00a7a2;
      --teal-soft: #e6faf9;
      --shadow-sm: 0 1px 3px rgba(17, 24, 39, 0.06);
      --shadow-md: 0 6px 16px rgba(17, 24, 39, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Sticky Navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--teal);
      color: #062a29;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .nav-search {
      flex: 1;
      min-width: 210px;
      max-width: 440px;
      position: relative;
    }

    .nav-search input {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.52rem 1rem 0.52rem 2.3rem;
      font-size: 0.92rem;
      color: var(--text-primary);
      transition: all 0.15s ease;
    }

    .nav-search input:focus {
      outline: none;
      background: var(--bg-white);
      border-color: var(--teal-dark);
      box-shadow: 0 0 0 3px rgba(0, 206, 200, 0.18);
    }

    .nav-search svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .nav-links a:hover { color: var(--teal-dark); }

    /* City Hero Banner */
    .city-header {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
    }

    .city-header-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 1.25rem;
    }

    .breadcrumb {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .breadcrumb span { color: var(--teal-dark); font-weight: 600; }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.15rem;
    }

    .title-row h1 {
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .show-count {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-subtle);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .date-pills {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .pill {
      background: var(--bg-white);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .pill.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #052e2d;
      font-weight: 700;
    }

    .secondary-filters {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    select.filter-select {
      background: var(--bg-white);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      overflow: hidden;
      background: var(--bg-white);
    }

    .view-btn {
      border: none;
      background: transparent;
      padding: 0.42rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .view-btn.active {
      background: var(--text-primary);
      color: var(--bg-white);
    }

    /* Main Container */
    main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3.5rem;
    }

    /* Venue Quick-Filter Strip */
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .section-heading h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }
